<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dangerous Dave (1988-style Web Tribute)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Dangerous Dave — 1988 Style</h1>
      <p class="subtitle">Collect every trophy, grab the key, and escape through the door.</p>
    </header>

    <section class="screen-shell" aria-label="Game screen">
      <canvas id="game" width="320" height="200" aria-label="Dangerous Dave game canvas"></canvas>
    </section>

    <section class="controls">
      <p><strong>Controls:</strong> ← → move • Z jump • X shoot • R restart level</p>
      <p>Press Enter on game over / victory.</p>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
